name: Bug report
description: Report a reproducible Moonrider port problem
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: checkboxes
    attributes:
      label: Safety and copyright
      options:
        - label: I removed credentials, private paths and commercial game assets from this report.
          required: true
  - type: input
    attributes:
      label: Handheld and SoC
      placeholder: Anbernic RG40xx H / Allwinner H700
    validations:
      required: true
  - type: input
    attributes:
      label: Firmware and exact version
      placeholder: muOS 2508.4 LOOSE GOOSE
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Affected subsystem
      options: [Video/render, Performance, Audio, Gamepad/input, Exit/frontend lifecycle, Packaging/install, Other]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Sanitized logs and measurements
      description: Paste text only. Never attach the game payload.
