name: Device compatibility report
description: Share a tested handheld/firmware result
title: "[Compatibility]: "
labels: [compatibility]
body:
  - type: input
    attributes:
      label: Handheld and SoC
    validations:
      required: true
  - type: input
    attributes:
      label: Firmware and version
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Result
      options: [Playable, Boots with major issues, Does not boot]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Video, audio, gamepad and exit results
    validations:
      required: true
  - type: textarea
    attributes:
      label: Performance observations
  - type: checkboxes
    attributes:
      label: Copyright
      options:
        - label: This report contains no commercial game assets.
          required: true
