name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*-alpha*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Report test runtimes
        run: |
          node --version
          python3 --version
      - name: Verify source-only public release contract
        run: sh scripts/verify-public-release.sh
      - name: Reject commercial game assets and oversized blobs
        run: |
          set -eu
          if git ls-files | grep -Ei '\.(ogg|mp3|wav|flac|m4a|aac|mp4|webm|png|jpe?g|webp|asar|exe)$'; then
            echo 'Forbidden commercial/binary asset extension is tracked.' >&2
            exit 1
          fi
          oversize=$(git ls-files -z | xargs -0 -r du -b | awk '$1 > 5242880 {print}')
          if [ -n "$oversize" ]; then
            echo "$oversize"
            echo 'Tracked file exceeds the 5 MiB source-tree limit.' >&2
            exit 1
          fi
      - name: Scan added repository content for common secrets
        run: python3 scripts/scan-public-secrets.py
