name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check scripts
        run: |
          bash -n Moonrider.sh scripts/*.sh tests/*.sh
          python3 -m py_compile scripts/*.py
      - name: Test port patches
        run: |
          node tests/test-audio-ghost.js
          node tests/test-frameskip.js
          node tests/test-frameskip-late-menu.js
          node tests/test-gamepad-latest-state.js
          bash tests/test-audio-command-queue.sh
          bash tests/test-audio-worker.sh
          bash tests/test-audio-service-contract.sh
          bash tests/test-audio-lifecycle-contract.sh
          bash tests/test-input-mailbox.sh
          bash scripts/verify-playable-contract.sh
      - name: Test BYO package structure with synthetic runtime
        run: |
          bash tests/test-package.sh
          bash tests/test-byo-runtime-shims.sh
          bash tests/test-extract-assets.sh
      - name: Reject game assets and secrets
        run: |
          if git ls-files | grep -Ei '\.(ogg|mp3|wav|flac|m4a|aac|mp4|webm|png|jpe?g|webp|asar|exe)$'; then
            echo 'Commercial/binary game asset is tracked.' >&2
            exit 1
          fi
          if git ls-files | grep -Ei '(^|/)(c2runtime\.js|data\.js|index\.html|images/|media/)|\.csv$'; then
            echo 'Commercial Construct 2 payload is tracked.' >&2
            exit 1
          fi
          python3 scripts/scan-public-secrets.py
